name: Fix Subscription (TEMP)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-subscription.yml']

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check user_roles
        run: |
          echo "=== Current user_roles ==="
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/user_roles?user_id=eq.61599f5b-c105-4fe8-a214-66039a8c2d94&select=*" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"

          echo ""
          echo "=== Adding admin role ==="
          curl -s -X POST \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/user_roles" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates" \
            -d '{"user_id": "61599f5b-c105-4fe8-a214-66039a8c2d94", "role": "admin"}'

          echo ""
          echo "=== Verifying ==="
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/user_roles?user_id=eq.61599f5b-c105-4fe8-a214-66039a8c2d94&select=*" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}"
