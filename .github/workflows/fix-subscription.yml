name: Fix Subscription (TEMP)

on:
  push:
    branches: [main]
    paths: ['.github/workflows/fix-subscription.yml']

permissions:
  contents: read

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check all table counts
        run: |
          TABLES="clientes declaracao_clientes financeiro cartao_itens wallets bank_balances delay_clientes delay_transacoes user_roles"
          for TABLE in $TABLES; do
            RESULT=$(curl -s \
              "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/${TABLE}?select=*&limit=1" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Prefer: count=exact" \
              -o /dev/null -w "%{http_code}")
            COUNT=$(curl -s \
              "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/${TABLE}?select=count" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Prefer: count=exact" -I 2>/dev/null | grep -i content-range | tr -d '\r')
            echo "TABLE ${TABLE}: HTTP=${RESULT} RANGE=${COUNT}"
          done
