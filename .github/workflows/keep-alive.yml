name: Keep Supabase Alive

on:
  schedule:
    # Runs every 5 days at 12:00 UTC (project pauses after 7 days)
    - cron: '0 12 */5 * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase health endpoint
        run: |
          curl -s "https://qubkmecpxbsdphtmwvvw.supabase.co/rest/v1/colaboradores?select=id&limit=1" \
            -H "apikey: ${{ secrets.VITE_SUPABASE_ANON_KEY }}" \
            -o /dev/null -w "Status: %{http_code}\n"
          echo "Ping enviado ao Supabase - projeto mantido ativo!"
