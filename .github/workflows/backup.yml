name: Backup Semanal dos Dados

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

# Os backups têm dados de clientes: ficam só no repositório PRIVADO iatrenilson/rw-backups,
# nunca neste repositório (que é público por causa do GitHub Pages).
# BACKUP_DEPLOY_KEY = chave SSH com escrita só no rw-backups (deploy key).
jobs:
  backup:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rw-backups
    steps:
      - uses: actions/checkout@v4
        with:
          repository: iatrenilson/rw-backups
          ssh-key: ${{ secrets.BACKUP_DEPLOY_KEY }}
          path: rw-backups

      - name: Exportar dados do Supabase
        run: |
          mkdir -p backups

          TABLES=("delay_clientes" "delay_transacoes" "delay_share_links" "clientes" "financeiro" "profiles" "wallet_transactions")

          for TABLE in "${TABLES[@]}"; do
            curl -s \
              "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/${TABLE}?select=*" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              > "backups/${TABLE}_$(date +%Y-%m-%d).json"
            echo "Exportado: ${TABLE}"
          done

          # Check auth users
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/auth/v1/admin/users?per_page=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            > "backups/auth_users_$(date +%Y-%m-%d).json"
          echo "Auth users exportado"

      - name: Salvar backup no repositório privado
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup@rwinvestimentos.com.br"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: dados de $(date +%d/%m/%Y)"
          git push
