name: Backup Semanal dos Dados

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

# Os backups têm dados de clientes e este repositório é público (GitHub Pages).
# Por isso cada backup é salvo TRANCADO com o cadeado .github/backup-cert.pem;
# só a chave guardada no Google Drive do dono abre:
#   openssl cms -decrypt -binary -inform DER -in ARQUIVO.tar.gz.enc -inkey CHAVE.pem | tar -xz
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Exportar dados do Supabase
        run: |
          echo "DIA=$(date +%Y-%m-%d)" >> "$GITHUB_ENV"
          DIA=$(date +%Y-%m-%d)
          DADOS="$RUNNER_TEMP/dados"
          mkdir -p "$DADOS"

          TABLES=("delay_clientes" "delay_transacoes" "delay_share_links" "clientes" "financeiro" "profiles" "wallet_transactions")

          for TABLE in "${TABLES[@]}"; do
            curl -s \
              "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/${TABLE}?select=*" \
              -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
              > "$DADOS/${TABLE}_${DIA}.json"
            echo "Exportado: ${TABLE} ($(wc -c < "$DADOS/${TABLE}_${DIA}.json") bytes)"
          done

          # Check auth users
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/auth/v1/admin/users?per_page=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            > "$DADOS/auth_users_${DIA}.json"
          echo "Auth users exportado"

          if grep -qs '"Invalid API key"' "$DADOS"/*.json; then
            echo "::warning::Supabase recusou a chave (SUPABASE_SERVICE_KEY): o backup de hoje não tem os dados."
          fi

      - name: Trancar o backup
        run: |
          mkdir -p backups
          tar -czf "$RUNNER_TEMP/backup.tar.gz" -C "$RUNNER_TEMP/dados" .
          openssl cms -encrypt -binary -aes256 -outform DER \
            -in "$RUNNER_TEMP/backup.tar.gz" \
            -out "backups/backup_${DIA}.tar.gz.enc" \
            .github/backup-cert.pem

      - name: Salvar backup no repositório
        run: |
          git config user.name "Backup Bot"
          git config user.email "backup@rwinvestimentos.com.br"
          git add backups/
          git diff --staged --quiet || git commit -m "backup: dados de $(date +%d/%m/%Y)"
          git push
