name: Check Data (TEMP)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Check auth users and clientes
        run: |
          mkdir -p _check

          # Check auth users
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/auth/v1/admin/users?per_page=20" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            | python3 -c "
import json, sys
data = json.load(sys.stdin)
users = data.get('users', [])
out = []
for u in users:
    out.append({
        'id': u.get('id'),
        'email': u.get('email'),
        'provider': [i.get('provider') for i in u.get('identities', [])],
        'created_at': u.get('created_at')
    })
print(json.dumps(out, indent=2))
" > _check/users.json

          # Check clientes count
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/clientes?select=id,nome,created_at&limit=50" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            > _check/clientes.json

          # Check financeiro (loans)
          curl -s \
            "${{ secrets.VITE_SUPABASE_URL }}/rest/v1/financeiro?select=id,created_at&limit=10" \
            -H "apikey: ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            -H "Authorization: Bearer ${{ secrets.SUPABASE_SERVICE_KEY }}" \
            > _check/financeiro.json

          echo "Done"

      - name: Save results
        run: |
          git config user.name "Check Bot"
          git config user.email "check@rwinvestimentos.com.br"
          git add _check/
          git diff --staged --quiet || git commit -m "temp: check data"
          git push
